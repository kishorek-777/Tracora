<svg width="54" height="54" viewBox="0 0 54 54" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Quantum Tech Obsidian to Deep Navy) -->
    <linearGradient id="tracoraSolidBg" x1="0" y1="0" x2="0" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <!-- Silicon Die Core Gradient -->
    <linearGradient id="dieSolidGrad" x1="15" y1="15" x2="39" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0e2158" />
    </linearGradient>

    <!-- Subtle Optical Glow for Code Syntax -->
    <filter id="softGlowSolid" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas (Matches Frappe Desktop Squircle Geometry 54x54) -->
  <path d="M38.5714 0H15.4286C6.90761 0 0 6.90761 0 15.4286V38.5714C0 47.0924 6.90761 54 15.4286 54H38.5714C47.0924 54 54 47.0924 54 38.5714V15.4286C54 6.90761 47.0924 0 38.5714 0Z" fill="url(#tracoraSolidBg)" />
  <rect x="1" y="1" width="52" height="52" rx="14" stroke="#1d4ed8" stroke-width="1.2" stroke-opacity="0.45" />

  <!-- Hardware Pin Leads (Top, Bottom, Left, Right) -->
  <path d="M19 6v4M27 6v4M35 6v4" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <path d="M19 44v4M27 44v4M35 44v4" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <path d="M6 19h4M6 27h4M6 35h4" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <path d="M44 19h4M44 27h4M44 35h4" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Corner Hardware Alignment Vias -->
  <circle cx="13.5" cy="13.5" r="1.1" fill="#38bdf8" opacity="0.75" />
  <circle cx="40.5" cy="13.5" r="1.1" fill="#38bdf8" opacity="0.75" />
  <circle cx="13.5" cy="40.5" r="1.1" fill="#38bdf8" opacity="0.75" />
  <circle cx="40.5" cy="40.5" r="1.1" fill="#38bdf8" opacity="0.75" />

  <!-- Silicon Die Package / Heatspreader -->
  <rect x="10" y="10" width="34" height="34" rx="7" fill="#0f172a" stroke="#2563eb" stroke-width="1.8" />
  <rect x="12" y="12" width="30" height="30" rx="5" stroke="#1e40af" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.5" />

  <!-- Inner Silicon Core -->
  <rect x="15" y="15" width="24" height="24" rx="4.5" fill="url(#dieSolidGrad)" stroke="#3b82f6" stroke-width="1.2" />

  <!-- Software Code Syntax: < / > (Solid Pure White & Glowing Cyan) -->
  <g filter="url(#softGlowSolid)">
    <!-- Left Bracket < -->
    <path d="M21 21.5L16.8 27L21 32.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Center Slash / -->
    <path d="M28.5 20.5L25.5 33.5" stroke="#38bdf8" stroke-width="2.3" stroke-linecap="round" />
    <!-- Right Bracket > -->
    <path d="M33 21.5L37.2 27L33 32.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

